<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Eonjemanna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>언제만나?</h1>
    <p>약속 시간을 정할 사람들의 닉네임을 입력해주세요.</p>

    <section class="card">
      <label for="personCount">약속 시간을 잡을 사람 수</label>
      <input 
        type="number" 
        id="personCount" 
        min="1" 
        max="10" 
        placeholder="최대 10명"
      >

      <button id="makeInputsBtn">입력칸 만들기</button>
    </section>

    <form id="nameForm" class="card hidden">
      <h2>닉네임 입력</h2>
      <p class="notice">실명 대신 닉네임을 입력해주세요. 입력값은 저장되지 않습니다.</p>

      <div id="nameInputs"></div>

      <button type="submit">확인</button>
    </form>

    <section id="resultBox" class="card hidden">
      <h2>입력된 닉네임</h2>
      <p id="resultText"></p>
      <p class="notice">이 정보는 서버에 저장되지 않으며, 새로고침하면 사라집니다.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
